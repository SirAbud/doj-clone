<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Age Verification | DOJ</title>

<style>
body {
    margin: 0;
    font-family: Arial, Helvetica, sans-serif;
    background-color: #f2f2f2;
}

.header {
    background-color: #002f6c;
    padding: 16px 40px;
    color: white;
    font-size: 22px;
    font-weight: bold;
}

.box {
    max-width: 540px;
    margin: 80px auto;
    background: #ffffff;
    padding: 30px;
    border: 1px solid #ccc;
}

.box h2 {
    margin-top: 0;
    font-size: 22px;
}

.box p {
    font-size: 14px;
    color: #333;
}

button {
    background-color: #002f6c;
    color: white;
    border: none;
    padding: 12px 22px;
    font-size: 15px;
    cursor: pointer;
    margin-top: 20px;
}

button:hover {
    background-color: #001f4d;
}
</style>
</head>

<body>

<div class="header">
    Department of Justice
</div>

<div class="box">
    <h2>Age Verification</h2>
    <p>
        You must be 18 years of age or older to access these materials.
        The content may contain sensitive information.
    </p>

    <form method="post">
        <button type="submit">Yes, I am 18 or older</button>
    </form>
</div>

</body>
</html>
